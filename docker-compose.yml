services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kalaro
      POSTGRES_USER: kalaro
      POSTGRES_PASSWORD: kalaro
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalaro"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  web:
    build: .
    image: kalaro-backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes: [".:/app"]
    ports: ["8000:8000"]
    env_file: [.env]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: .
    image: kalaro-backend
    command: celery -A config worker -l info
    volumes: [".:/app"]
    env_file: [.env]
    depends_on: [db, redis]

  beat:
    build: .
    image: kalaro-backend
    command: celery -A config beat -l info
    volumes: [".:/app"]
    env_file: [.env]
    depends_on: [db, redis]

volumes:
  pgdata: