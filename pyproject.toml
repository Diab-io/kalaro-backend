[project]
name = "kalaro-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "django-ninja>=1.3",
    "django-ninja-jwt>=5.3",
    "django-ninja-extra>=0.21",
    "psycopg[binary]>=3.2",
    "django-environ>=0.11",
    "django-cors-headers>=4.4",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "django-storages[s3]>=1.14",
    "pillow>=10.4",
    "sentry-sdk[django]>=2.13",
    "gunicorn>=23.0",
    "whitenoise>=6.7",
    "google-auth>=2.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "model-bakery>=1.19",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py"]
addopts = "--reuse-db"
